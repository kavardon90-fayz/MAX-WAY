<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAX WAY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .cart {
            font-size: 18px;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .product h2 {
            margin-top: 0;
        }

        .description {
            color: #666;
            min-height: 45px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        .button {
            display: block;
    width: 100%;
    border: none;
    padding: 12px;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
        }

        .button:hover {
            opacity: 0.8;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">MAX WAY</div>

    <a href="{% url 'cart' %}" class="cart">
    🛒 Savat
</a>
</header>

<div class="container">

    <h1>Mahsulotlar</h1>

    <div class="products">

        {% for product in products %}

            <div class="product">

                {% if product.image %}
                    <img
                        src="{{ product.image.url }}"
                        alt="{{ product.title }}"
                        class="product-image"
                    >
                {% endif %}

                <h2>{{ product.title }}</h2>

                <div class="description">
                    {{ product.description }}
                </div>

                <div class="price">
                    {{ product.price }} so'm
                </div>

               <a href="{% url 'add_to_cart' product.id %}" class="button">
    🛒 Savatga qo‘shish
</a>

            </div>

        {% empty %}

            <div class="empty">
                Hozircha mahsulotlar mavjud emas.
            </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
