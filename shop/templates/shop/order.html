<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyurtma berish - MAX WAY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 20px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        header h2 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .order-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .payment {
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .payment label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: 25px;
            font-weight: normal;
        }

        .payment input {
            width: auto;
        }

        .total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin-top: 25px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        .order-button {
            width: 100%;
            border: none;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .order-button:hover {
            opacity: 0.85;
        }

        .products {
            margin-bottom: 25px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        /* LOKATSIYA */

        .location-box {
            margin-top: 10px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            border: 1px solid #ddd;
        }

        .location-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #28a745;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .location-button:hover {
            opacity: 0.9;
        }

        .location-button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .location-success {
            display: none;
            margin-top: 12px;
            padding: 15px;
            border-radius: 10px;
            background: #e8f5e9;
            color: #1b5e20;
            line-height: 1.6;
        }

        .map-link {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            font-weight: bold;
            color: #1565c0;
        }

        .location-error {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #ffebee;
            color: #c62828;
        }

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            .container {
                padding: 0 10px;
            }

            .order-box {
                padding: 20px;
            }

            .total {
                font-size: 18px;
            }

            .payment label {
                display: flex;
                margin-bottom: 12px;
            }
        }
        .delivery-options {
    display: flex;
    gap: 15px;
    margin-top: 10px;
}

.delivery-option {
    flex: 1;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
    background: white;
}

.delivery-option:hover {
    border-color: #28a745;
}

.delivery-option input {
    width: auto;
    margin-right: 8px;
}

@media (max-width: 600px) {

    .delivery-options {
        flex-direction: column;
    }

}
    </style>
</head>

<body>

<header>
    <h2>MAX WAY 📦 Buyurtma</h2>
</header>

<div class="container">

    <div class="order-box">

        <h1>Buyurtma berish</h1>

        <form method="POST">

            {% csrf_token %}


            <!-- BUYURTMA MAHSULOTLARI -->

            <div class="products">

                {% for item in cart_items %}

                    <div class="product">

                        <span>
                            {{ item.product.title }}
                            × {{ item.quantity }}
                        </span>

                        <strong>
                            {{ item.total }} so'm
                        </strong>

                    </div>

                {% empty %}

                    <p>Savatda mahsulot yo‘q.</p>

                {% endfor %}

            </div>


            <!-- ISM -->

            <div class="form-group">

                <label for="first_name">
                    Ism
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="Ismingizni kiriting"
                    required
                >

            </div>


            <!-- FAMILIYA -->

            <div class="form-group">

                <label for="last_name">
                    Familiya
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    placeholder="Familiyangizni kiriting"
                    required
                >

            </div>


            <!-- TELEFON -->

            <div class="form-group">

                <label for="phone">
                    Telefon raqami
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+998 90 123 45 67"
                    required
                >

            </div>


            <!-- MANZIL -->

            <div class="form-group">

                <label for="address">
                    Manzil
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Yetkazib berish manzilingiz"
                    required
                ></textarea>

            </div>


            <!-- LOKATSIYA -->

            <div class="form-group">

                <label>
                    📍 Yetkazib berish lokatsiyasi
                </label>

                <div class="location-box">

                    <button
                        type="button"
                        onclick="getLocation()"
                        id="location-button"
                        class="location-button"
                    >
                        📍 Lokatsiyani aniqlash
                    </button>


                    <!-- MUVAFFAQIYAT -->

                    <div
                        id="location-success"
                        class="location-success"
                    >

                        <strong>
                            🟢 Lokatsiya aniqlandi!
                        </strong>

                        <div id="coordinates"></div>

                        <a
                            id="map-link"
                            class="map-link"
                            href="#"
                            target="_blank"
                        >
                            🗺️ Xaritada ko‘rish
                        </a>

                    </div>


                    <!-- XATO -->

                    <div
                        id="location-error"
                        class="location-error"
                    ></div>

                </div>


                <!-- YASHIRIN KOORDINATALAR -->

                <input
                    type="hidden"
                    id="latitude"
                    name="latitude"
                >

                <input
                    type="hidden"
                    id="longitude"
                    name="longitude"
                >

            </div>
            <!-- DOSTAVKA TURI -->

<div class="form-group">

    <label>
        🚚 Yetkazib berish turi
    </label>

    <div class="delivery-options">

        <label class="delivery-option">

            <input
                type="radio"
                name="delivery_type"
                value="1"
                checked
            >

            🚚 Dostavka kerak

        </label>

        <label class="delivery-option">

            <input
                type="radio"
                name="delivery_type"
                value="2"
            >

            🏃 O‘zim olib ketaman

        </label>

    </div>

</div>


            <!-- TO'LOV -->

            <div class="payment">

                <label>

                    <input
                        type="radio"
                        name="payment_type"
                        value="1"
                        checked
                    >

                    💵 Naqd

                </label>


                <label>

                    <input
                        type="radio"
                        name="payment_type"
                        value="2"
                    >

                    💳 Karta

                </label>

            </div>


            <!-- JAMI -->

            <div class="total">

                <span>
                    JAMI:
                </span>

                <strong>
                    {{ grand_total }} so'm
                </strong>

            </div>


            <!-- BUYURTMA -->

            <button
                class="order-button"
                type="submit"
            >
                📦 Buyurtmani tasdiqlash
            </button>

        </form>

    </div>

</div>


<!-- JAVASCRIPT -->

<script>

function getLocation() {

    const button = document.getElementById("location-button");
    const success = document.getElementById("location-success");
    const errorBox = document.getElementById("location-error");
    const coordinates = document.getElementById("coordinates");
    const mapLink = document.getElementById("map-link");

    button.innerText = "📍 Lokatsiya aniqlanmoqda...";
    button.disabled = true;

    success.style.display = "none";
    errorBox.style.display = "none";


    if (!navigator.geolocation) {

        errorBox.innerText =
            "❌ Brauzeringiz lokatsiyani qo‘llab-quvvatlamaydi.";

        errorBox.style.display = "block";

        button.innerText = "📍 Lokatsiyani aniqlash";
        button.disabled = false;

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;


            // DJANGO FORMAGA SAQLASH

            document.getElementById("latitude").value = latitude;
            document.getElementById("longitude").value = longitude;


            // EKRANGA CHIQARISH

            coordinates.innerHTML =
                "📍 Latitude: " +
                latitude.toFixed(6) +
                "<br>" +
                "📍 Longitude: " +
                longitude.toFixed(6);


            // GOOGLE MAPS

            mapLink.href =
                "https://www.google.com/maps?q=" +
                latitude +
                "," +
                longitude;


            success.style.display = "block";


            button.innerText =
                "✅ Lokatsiya aniqlandi";

            button.disabled = false;

        },


        function(error) {

            button.innerText =
                "📍 Lokatsiyani aniqlash";

            button.disabled = false;


            if (error.code === 1) {

                errorBox.innerText =
                    "❌ Lokatsiyaga ruxsat berilmadi. " +
                    "Brauzer sozlamalaridan Location → Allow qiling.";

            }

            else if (error.code === 2) {

                errorBox.innerText =
                    "❌ Lokatsiya aniqlanmadi.";

            }

            else if (error.code === 3) {

                errorBox.innerText =
                    "❌ Lokatsiyani aniqlash vaqti tugadi.";

            }

            else {

                errorBox.innerText =
                    "❌ Lokatsiyani olishda xatolik yuz berdi.";

            }


            errorBox.style.display = "block";

        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}

</script>

</body>
</html>
