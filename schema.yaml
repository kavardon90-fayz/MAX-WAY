components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
    CategoryRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - title
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - first_name
      - id
      - last_name
      - phone_number
    CustomerRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - first_name
      - last_name
      - phone_number
    DeliveryTypeEnum:
      enum:
      - 1
      - 2
      type: integer
      description: |-
        * `1` - Dostavka kerak
        * `2` - Dostavka kerak emas
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        payment_type:
          allOf:
          - $ref: '#/components/schemas/PaymentTypeEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        delivery_type:
          allOf:
          - $ref: '#/components/schemas/DeliveryTypeEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        status:
          type: integer
          readOnly: true
        address:
          type: string
          maxLength: 250
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        customer:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - customer
      - id
      - payment_type
      - status
    OrderProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        count:
          type: integer
          minimum: 1
        price:
          type: integer
          readOnly: true
        product_title:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        product:
          type: integer
        order:
          type: integer
      required:
      - count
      - created_at
      - id
      - order
      - price
      - product
      - product_title
    OrderProductRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
        product:
          type: integer
        order:
          type: integer
      required:
      - count
      - order
      - product
    OrderRequest:
      type: object
      properties:
        payment_type:
          allOf:
          - $ref: '#/components/schemas/PaymentTypeEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        delivery_type:
          allOf:
          - $ref: '#/components/schemas/DeliveryTypeEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        address:
          type: string
          minLength: 1
          maxLength: 250
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
      required:
      - address
      - payment_type
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedCustomerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    PaginatedOrderList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
